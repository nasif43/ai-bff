<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI BFF - Real-Time Live Voice</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Status Bar -->
        <header class="app-header">
            <div class="header-left">
                <span class="status-indicator" id="statusDot"></span>
                <span class="status-title" id="statusText">Connecting...</span>
            </div>
            <div class="header-right">
                <button type="button" id="resetBtn" class="pill-btn danger" title="Clear memory">Reset Memory</button>
            </div>
        </header>

        <!-- Persona Configuration Chips -->
        <section class="persona-selector">
            <div class="selector-group">
                <div class="selector-header">
                    <label class="group-label">Archetype</label>
                    <span class="persona-hint">Dark Soul · Trickster · Soother</span>
                </div>
                <div class="chip-row" id="archetypeChips">
                    <button type="button" class="chip active" data-archetype="DarkSoul">Dark Soul</button>
                    <button type="button" class="chip" data-archetype="Trickster">Trickster</button>
                    <button type="button" class="chip" data-archetype="Soother">Soother</button>
                </div>
            </div>

            <div class="selector-group">
                <div class="selector-header">
                    <label class="group-label">Personality Modifier</label>
                    <span class="persona-hint">Delulu · Online · Villain · Unbothered</span>
                </div>
                <div class="chip-row" id="attitudeChips">
                    <button type="button" class="chip active" data-attitude="Delulu">Delulu</button>
                    <button type="button" class="chip" data-attitude="ChronicallyOnline">Chronically Online</button>
                    <button type="button" class="chip" data-attitude="VillainEra">Villain Era</button>
                    <button type="button" class="chip" data-attitude="Unbothered">Unbothered</button>
                </div>
            </div>

            <div class="selector-group compact">
                <label class="group-label">Voice Gender</label>
                <div class="chip-row" id="genderChips">
                    <button type="button" class="chip active" data-gender="M">Male (Adam/Liam)</button>
                    <button type="button" class="chip" data-gender="F">Female (Jessica/Laura)</button>
                </div>
            </div>
        </section>

        <!-- Central Live Voice Visualizer & Stage Card -->
        <main class="voice-stage">
            <!-- Dynamic Voice Orb Canvas -->
            <div class="orb-container">
                <canvas id="visualizerCanvas" width="300" height="300"></canvas>
                <div class="orb-overlay">
                    <span class="emotion-badge" id="activeEmotion">READY</span>
                    <span class="live-indicator" id="liveIndicator">HANDS-FREE VAD</span>
                </div>
            </div>

            <!-- Real-Time Subtitle & Karaoke Card -->
            <div class="dialogue-card" id="dialogueCard">
                <div class="card-meta">
                    <span class="speaker-tag" id="activeSpeaker">AI BFF</span>
                    <span class="turn-timing" id="turnTiming"></span>
                </div>
                <div class="user-bubble" id="userBubble" style="display: none;"></div>
                <div class="karaoke-text" id="karaokeContainer">
                    Tap <strong>Start Live Call</strong> below to speak freely.
                </div>
            </div>
        </main>

        <!-- Hidden Audio Player for Low-Latency Playback -->
        <audio id="audioPlayer" preload="auto"></audio>

        <!-- Voice Call Controls -->
        <footer class="app-footer">
            <!-- Primary Live Call Button -->
            <button type="button" id="callToggleBtn" class="call-toggle-btn idle">
                <span class="call-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
                        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-2.2 2.2a15.05 15.05 0 01-6.59-6.59l2.2-2.21a.96.96 0 00.25-1.01A11.36 11.36 0 018.57 3.9c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.52c0-.55-.45-1-.99-1z"/>
                    </svg>
                </span>
                <span class="call-text" id="callBtnText">START LIVE CALL</span>
            </button>

            <!-- Secondary Controls Row (Barge-in Stop + Text Toggle) -->
            <div class="secondary-controls">
                <button type="button" id="stopBtn" class="pill-btn stop-audio-btn">■ Interrupt / Stop</button>
                <button type="button" id="textToggleBtn" class="pill-btn secondary-btn">⌨ Text Mode</button>
            </div>

            <!-- Collapsible Secondary Text Bar -->
            <div class="collapsible-text-bar" id="textBar" style="display: none;">
                <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off">
                <button type="button" id="sendBtn" class="send-button">➤</button>
            </div>

            <!-- Quick Trigger Chips for Stage Rehearsal -->
            <div class="quick-prompts-container">
                <span class="quick-label">PROMPTS:</span>
                <div class="quick-chips">
                    <button type="button" class="quick-chip" data-prompt="Bestie, I think I failed my exam today.">💀 Failed Exam</button>
                    <button type="button" class="quick-chip" data-prompt="Should I text my ex right now?">📱 Text Ex?</button>
                    <button type="button" class="quick-chip" data-prompt="Everyone at school is literally staring at me.">👀 People Staring</button>
                    <button type="button" class="quick-chip" data-prompt="I have zero motivation to do anything.">😴 No Motivation</button>
                </div>
            </div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
